      description: "A weathered wooden chest with iron bands. It looks like it hasn't been opened in years."
      properties:
        locked: true
        key_required: true
    - name: Rusty Sword
      description: "An old sword with a rusted blade. It seems fragile but could still be useful in a pinch."
      properties:
        damage: 5
        durability: 10
